name: E2E (Cloudflare Preview)

on:
  push:
    branches: [main]
    paths:
      - 'webui/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-preview
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # pnpm version comes from package.json "packageManager" (single source of truth)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E against Cloudflare Preview
        run: npx playwright test --reporter=line
        env:
          E2E_BASE_URL: https://construction-os-mvp.mirai-dx-platform.com
          # e2e/api.spec.ts は E2E_API_BASE_URL を参照する(ブラウザ用の E2E_BASE_URL とは別)
          E2E_API_BASE_URL: https://construction-os-mvp.mirai-dx-platform.com
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

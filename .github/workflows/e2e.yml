name: E2E (Cloudflare Preview)

on:
  push:
    branches: [main]
    paths:
      - 'webui/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-preview
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E against Cloudflare Preview
        run: npx playwright test --reporter=line
        env:
          E2E_BASE_URL: https://construction-os-mvp.mirai-dx-platform.com
          # e2e/api.spec.ts は E2E_API_BASE_URL を参照する(ブラウザ用の E2E_BASE_URL とは別)
          E2E_API_BASE_URL: https://construction-os-mvp.mirai-dx-platform.com
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

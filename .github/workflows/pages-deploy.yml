name: Pages Deploy (MVP WebUI)

on:
  push:
    branches: [main]
    paths:
      - 'webui/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy-webui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MVP プレビュー / 本番 の両 Pages プロジェクトへ同一内容をデプロイ
        project: [construction-os-mvp, construction-os-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install wrangler
        run: npm i -g wrangler@4

      - name: Prepare deploy directory
        run: |
          mkdir -p .deploy-webui
          # 2026-08-19: デプロイ対象を「OpenDesign 正本スタイル + 全ページCRUD」統合版に切替
          # (Construction-Enterprise-OS---CRUD.html = 正本バンドルにデータ層/CRUDを組み込んだもの)
          cp "webui/Construction-Enterprise-OS---CRUD.html" .deploy-webui/index.html
          cp "webui/Construction-Enterprise-OS---Standalone-_1_.html" ".deploy-webui/standalone-prototype.html"
          cp webui/brand-spec.md webui/DESIGN-HANDOFF.md webui/DESIGN-MANIFEST.json .deploy-webui/
          cp webui/index.html .deploy-webui/management-review-deck.html
          cp -r webui/functions .deploy-webui/functions
          ls -la .deploy-webui/

      - name: Deploy to Cloudflare Pages (${{ matrix.project }})
        # wrangler は functions/ をカレントディレクトリ基準で検出するため、
        # デプロイ対象ディレクトリを作業ディレクトリとして "." を指定する
        # (親ディレクトリから ".deploy-webui" を引数にすると Functions が
        #  ビルドされず、/api/* が SPA フォールバックになる問題を回避)
        working-directory: .deploy-webui
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy . --project-name ${{ matrix.project }} --branch main

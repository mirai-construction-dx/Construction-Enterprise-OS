name: Construction-Enterprise-OS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================
  # Python バックエンド (FastAPI)
  # ============================================
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          # Foundation layer
          - services/auth
          - services/document
          - services/workflow
          - services/gis
          - services/iot
          - services/notification
          # Data & Intelligence layer
          - services/analytics
          - services/ai
          - services/bim
          - services/vision
          # Platform layer
          - services/advanced
          - services/automation
          - services/gateway
          - services/partner
          - services/platform
          - services/security
          # Business Application layer
          - services/construction
          - services/erp
          - services/field-dx
          - services/maintenance
          - services/safety
          # Autonomous layer
          - services/autonomous
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Type check (MyPy)
        run: mypy src/

      - name: Test (Pytest)
        run: pytest tests/ --cov=src --cov-report=xml -p no:flask

      # models と migrations/000_base_schema.sql の乖離を検出する
      # (乖離したまま配置すると、空DBでテーブルが作られず実行時に全滅する)
      - name: Base schema DDL is in sync with models
        run: python ../../scripts/db/generate_base_schema.py --check "$(basename "$PWD")"

  # ============================================
  # MCP サービス (読み取り専用 / services/mcp)
  # ============================================
  # MCP サービスは DB を持たないため、python-checks の DB スキーマ検証の対象外。
  # 専用ジョブで lint / 型 / テスト を実行する（既存マトリクスは変更しない）。
  mcp-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Type check (MyPy)
        run: mypy src/

      - name: Test (Pytest)
        run: pytest tests/ --cov=src --cov-report=xml -p no:flask

  # ============================================
  # 共有 Python パッケージ (packages/logging, packages/event-core)
  # ============================================
  packages-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/logging
          - packages/event-core
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r ../requirements-test.txt

      - name: Test (Pytest)
        run: PYTHONPATH=. pytest tests/ -p no:flask

  # ============================================
  # TypeScript フロントエンド / 共有パッケージ
  # ============================================
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # ============================================
  # セキュリティスキャン
  # ============================================
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          pip install pip-audit
          ignore_args=()
          if [ -f .github/security/pip-audit-ignore.txt ]; then
            while IFS= read -r id; do
              case "${id}" in ''|'#'*) continue;; esac
              ignore_args+=("--ignore-vuln" "${id}")
            done < .github/security/pip-audit-ignore.txt
          fi
          failed=0
          for req in $(find services packages -name requirements.txt | sort); do
            svc="$(basename "$(dirname "$req")")"
            echo "::group::pip-audit ${req}"
            pip-audit -r "${req}" -f json -o "pip-audit-${svc}.json" "${ignore_args[@]}" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-results
          path: pip-audit-*.json
          if-no-files-found: ignore

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .github/security/trivy-ignore.txt
          format: table
          output: trivy-results.txt

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-results
          path: trivy-results.txt
          if-no-files-found: ignore

  # ============================================
  # ビルド検証
  # ============================================
  docker-build-services:
    runs-on: ubuntu-latest
    needs: [python-checks, mcp-checks, packages-checks, frontend-checks]
    strategy:
      fail-fast: false
      matrix:
        # All services with a Dockerfile under services/ (keep in sync when adding a service)
        service:
          - advanced
          - ai
          - analytics
          - auth
          - automation
          - autonomous
          - bim
          - construction
          - document
          - erp
          - field-dx
          - gateway
          - gis
          - iot
          - maintenance
          - mcp
          - notification
          - partner
          - platform
          - safety
          - security
          - vision
          - workflow
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build ${{ matrix.service }} service
        run: docker build -t construction-enterprise-os/${{ matrix.service }}:test services/${{ matrix.service }}/

  docker-build-web:
    runs-on: ubuntu-latest
    needs: [frontend-checks]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build web app
        run: docker build -t construction-enterprise-os/web:test apps/web/

  # Required status check name (ruleset: "docker-build-test"). Aggregates the matrix builds so
  # the required context stays a single, stable name.
  docker-build-test:
    runs-on: ubuntu-latest
    needs: [docker-build-services, docker-build-web]
    if: always()
    steps:
      - name: All Docker builds succeeded
        run: |
          echo "services=${{ needs.docker-build-services.result }} web=${{ needs.docker-build-web.result }}"
          test "${{ needs.docker-build-services.result }}" = "success"
          test "${{ needs.docker-build-web.result }}" = "success"
